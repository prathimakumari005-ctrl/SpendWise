<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Transaction | SpendWise</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<header class="header">
    <h1>SpendWise</h1>
    <p>Edit your transaction</p>
</header>

<main class="container">
    <section class="form-card">
        <h2>Edit Transaction</h2>

        {% for message in get_flashed_messages() %}
            <p class="notice">{{ message }}</p>
        {% endfor %}

        <form method="POST">
            <label for="title">Description</label>
            <input type="text" id="title" name="title"
                   value="{{ transaction['title'] }}" required>

            <label for="category">Category</label>
            <select id="category" name="category" required>
                {% for category in [
                    'Salary', 'Food', 'Transport', 'Education',
                    'Shopping', 'Bills', 'Healthcare', 'Entertainment',
                    'Rent', 'Other'
                ] %}
                    <option value="{{ category }}"
                        {% if transaction['category'] == category %}selected{% endif %}>
                        {{ category }}
                    </option>
                {% endfor %}
            </select>

            <label for="amount">Amount (₹)</label>
            <input type="number" id="amount" name="amount"
                   min="0.01" step="0.01"
                   value="{{ transaction['amount'] }}" required>

            <label for="type">Transaction Type</label>
            <select id="type" name="type" required>
                <option value="Income"
                    {% if transaction['type'] == 'Income' %}selected{% endif %}>
                    Income
                </option>
                <option value="Expense"
                    {% if transaction['type'] == 'Expense' %}selected{% endif %}>
                    Expense
                </option>
            </select>

            <button type="submit">Save Changes</button>
        </form>

        <a href="{{ url_for('home') }}" class="back-link">
            ← Back to Dashboard
        </a>
    </section>
</main>

</body>
</html>
