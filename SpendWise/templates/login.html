
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SpendWise</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; font-family: Arial, sans-serif;
            background: #f3f6fb; display: grid;
            place-items: center; min-height: 100vh; padding: 20px;
        }
        .card {
            background: white; width: 100%; max-width: 400px;
            padding: 30px; border-radius: 16px;
            box-shadow: 0 5px 25px #0001;
        }
        h1 { color: #172554; text-align: center; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #64748b; margin-bottom: 25px; }
        label { display: block; margin: 14px 0 6px; }
        input {
            width: 100%; padding: 12px; border: 1px solid #cbd5e1;
            border-radius: 7px; font-size: 16px;
        }
        button {
            width: 100%; padding: 13px; margin-top: 22px;
            background: #0d9488; color: white; border: 0;
            border-radius: 7px; font-size: 16px; cursor: pointer;
        }
        .link { text-align: center; margin-top: 20px; }
        a { color: #0d9488; }
        .message { color: #b91c1c; text-align: center; }
    </style>
</head>
<body>
    <main class="card">
        <h1>SpendWise</h1>
        <p class="subtitle">Welcome back! Please log in.</p>

        {% for message in get_flashed_messages() %}
            <p class="message">{{ message }}</p>
        {% endfor %}

        <form method="POST">
            <label for="email">Email Address</label>
            <input id="email" name="email" type="email"
                   autocomplete="email" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password"
                   autocomplete="current-password" required>

            <button type="submit">Login</button>
        </form>

        <p class="link">New to SpendWise?
            <a href="{{ url_for('register') }}">Create an account</a>
        </p>
    </main>
</body>
</html>
